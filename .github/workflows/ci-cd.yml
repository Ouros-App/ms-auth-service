name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  checks: write
  issues: write
  pull-requests: read
  security-events: write

jobs:
  conventional-commits-warning:
    name: conventional-commits-warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'rerun-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report conventional commit warning
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+/;
            const invalid = [];
            if (!pattern.test(process.env.PR_TITLE)) invalid.push(`PR title: ${process.env.PR_TITLE}`);
            const range = `${process.env.BASE_SHA}..${process.env.HEAD_SHA}`;
            const subjects = execFileSync("git", ["log", "--no-merges", "--format=%s", range], { encoding: "utf8" })
              .split(/\r?\n/).filter(Boolean);
            for (const subject of subjects) {
              if (!pattern.test(subject)) invalid.push(`Commit: ${subject}`);
            }
            const marker = "<!-- conventional-commits-warning -->";
            const valid = invalid.length === 0;
            const summary = valid
              ? "PR title and commit messages follow Conventional Commits."
              : `The PR remains mergeable, but these messages do not follow Conventional Commits:\n\n${invalid.map(item => `- ${item}`).join("\n")}`;
            try {
              await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo, name: "conventional-commits", head_sha: process.env.HEAD_SHA, status: "completed", conclusion: valid ? "success" : "neutral", output: { title: valid ? "Conventional Commits" : "Conventional Commits warning", summary } });
            } catch (error) { core.warning(`Could not publish the Conventional Commits check: ${error.message}`); }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
              if (invalid.length) {
                const body = `${marker}\n⚠️ **Conventional Commits:** aviso não bloqueante.\n\n${summary}\n\nO CI funcional continua sendo validado normalmente.`;
                if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
                else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
              } else if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n✅ **Conventional Commits:** aviso resolvido; o título e os commits estão no padrão.` });
            } catch (error) { core.warning(`Could not publish the Conventional Commits comment: ${error.message}`); }

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'rerun-ci'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      MONGODB_URL: mongodb://localhost:27017/app_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_RUN_NUMBER" = "1" ]; then
            rc=0
            pytest --cov=app --cov-report=xml:coverage.xml || rc=$?
            if [ "$rc" = "5" ]; then
              echo "Skipping pytest on first workflow run because no tests were collected."
              exit 0
            fi
            exit "$rc"
          elif find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null | grep -q .; then
            pytest --cov=app --cov-report=xml:coverage.xml
          else
            echo "No tests found."
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Build validation
        run: python -m compileall .

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Configure SonarCloud
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_key="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "sonar.organization=${SONAR_ORGANIZATION:-$owner_key}"
            echo "sonar.projectKey=${SONAR_PROJECT_KEY:-${owner}_${repo}}"
            echo "sonar.sources=app"
            echo "sonar.tests=tests"
            echo "sonar.python.coverage.reportPaths=coverage.xml"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "sonar.branch.name=main"
            fi
          } > sonar-project.properties

      - name: Disable Automatic Analysis via API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key="$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)"
          curl -sS -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/projects/update_default_analysis_configuration" \
            -d "project=${project_key}" \
            -d "autoScan=false"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish SonarCloud project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key="$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)"
          curl -sS -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/projects/update_visibility" \
            -d "project=${project_key}" \
            -d "visibility=public"

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
